<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#1e293b" />
      <stop offset="100%" stopColor="#0b1120" />
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stopColor="#fef08a" />
      <stop offset="50%" stopColor="#f59e0b" />
      <stop offset="100%" stopColor="#b45309" />
    </radialGradient>
    <radialGradient id="haloLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#f59e0b" stopOpacity="0.4" />
      <stop offset="100%" stopColor="#f59e0b" stopOpacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  
  <!-- Outer Rosary Beads Circle (Halo) -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#78350f" stroke-width="3" stroke-dasharray="4 6" opacity="0.6" />
  <circle cx="256" cy="256" r="160" fill="url(#haloLight)" />

  <!-- 10 Symbolic Glowing Decade Beads on border -->
  <g fill="url(#goldGlow)">
    <circle cx="256" cy="76" r="10" />
    <circle cx="362" cy="110" r="8" />
    <circle cx="432" cy="195" r="8" />
    <circle cx="432" cy="317" r="8" />
    <circle cx="362" cy="402" r="8" />
    <circle cx="256" cy="436" r="10" />
    <circle cx="150" cy="402" r="8" />
    <circle cx="80" cy="317" r="8" />
    <circle cx="80" cy="195" r="8" />
    <circle cx="150" cy="110" r="8" />
  </g>

  <!-- Central Radiant Cross (Crucifix) -->
  <!-- Vertical Beam -->
  <rect x="236" y="110" width="40" height="260" rx="8" fill="url(#goldGlow)" stroke="#fef08a" stroke-width="3" />
  <!-- Horizontal Beam -->
  <rect x="156" y="175" width="200" height="40" rx="8" fill="url(#goldGlow)" stroke="#fef08a" stroke-width="3" />

  <!-- Center Highlight -->
  <circle cx="256" cy="195" r="16" fill="#ffffff" opacity="0.9" />
  <circle cx="256" cy="195" r="28" fill="#fef08a" opacity="0.4" />
</svg>
